name: Install reviewed production dependencies
description: Install the one hashed wheelhouse shared by all test jobs and the release
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: production-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
        path: .ci-deps
    - shell: bash
      run: |
        python -m pip install --no-index --find-links .ci-deps/wheelhouse --require-hashes --no-deps -r .ci-deps/requirements.lock
        python -m pip check
