{% if turnstile_enabled %}
<div class="p-turnstile-wrap">
  <div
    class="cf-turnstile"
    data-sitekey="{{ turnstile_site_key }}"
    data-action="{{ turnstile_action }}"
    data-theme="auto"
    data-language="fa"
    data-retry="auto"
    data-refresh-expired="auto"
  ></div>
</div>
<noscript>
  <div class="p-alert p-alert-warning p-turnstile-noscript">
    برای تأیید امنیتی، JavaScript مرورگر باید فعال باشد.
  </div>
</noscript>
{% endif %}
