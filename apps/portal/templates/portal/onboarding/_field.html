{# یک فیلدِ فرم: برچسب + نشانِ الزامی/اختیاری + راهنما + «همه‌ی» خطاها. پارامترها: field، required، ltr #}
<div class="ob-field{% if field.errors %} has-error{% endif %}{% if full %} ob-field--full{% endif %}">
  <label class="ob-label" for="{{ field.id_for_label }}">{{ field.label }}{% if required %}<span class="ob-tag ob-tag-required">الزامی</span>{% else %}<span class="ob-tag">اختیاری</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="ob-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="ob-error">{{ error }}</p>{% endfor %}
</div>
