{% load public_site %}
<div class="tpl" data-cat="{{ t.cat }}" data-name="{{ t.name }}"><div class="im">{% if t.thumbnail_kind == 'screenshot' %}<img src="{{ t.thumbnail_url }}" alt="پیش‌نمایش قالب {{ t.name }}" loading="lazy" decoding="async">{% else %}<span class="tpl-svg" role="img" aria-label="پیش‌نمایش قالب {{ t.name }}">{{ t.thumbnail_svg|safe }}</span>{% endif %}{% if t.cat %}<span class="cat">{{ t.cat }}</span>{% endif %}</div><div class="board"></div><div class="bd"><h3>{% ps 'design.card_prefix' %} {{ t.name }}</h3>{% if t.desc %}<p>{{ t.desc }}</p>{% endif %}<div class="row"><a href="{% url 'portal:register' %}" class="lnk">{% ps 'design.card_link' %}</a></div></div></div>
