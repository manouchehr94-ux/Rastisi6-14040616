{% if a.is_duplicate %}
<details class="pa-details"><summary class="pa-btn">رسیدگی</summary>
  {% if a.resolution.outcome != "pending_manual" and a.resolution.outcome != "requesting" and a.resolution.outcome != "unknown" %}
  <form method="post" class="pa-form" action="{% url 'portal_platform_admin:payment-duplicate-action' kind a.pk 'refund' %}" data-confirm="درخواستِ بازپرداختِ همین پرداختِ تکراری از درگاه؟ خریدِ اصلی تغییر نمی‌کند.">{% csrf_token %}
    <div class="pa-field"><label for="dr-{{ kind }}-{{ a.pk }}">دلیل</label><input id="dr-{{ kind }}-{{ a.pk }}" name="reason" required minlength="4"></div>
    <button class="pa-btn pa-primary" type="submit">درخواستِ بازپرداخت از درگاه</button>
  </form>
  {% endif %}
  <form method="post" class="pa-form" action="{% url 'portal_platform_admin:payment-duplicate-action' kind a.pk 'resolve' %}" data-confirm="ثبتِ تسویه‌ی بیرونیِ این پرداختِ تکراری؟">{% csrf_token %}
    <div class="pa-field"><label for="dx-{{ kind }}-{{ a.pk }}">نتیجه</label>
      <select id="dx-{{ kind }}-{{ a.pk }}" name="outcome"><option value="refunded_external">بازپرداخت شد (خارج از سامانه)</option><option value="credited">به‌عنوانِ اعتبار منظور شد</option><option value="not_an_overpayment">پرداختِ اضافه نبود</option></select></div>
    <div class="pa-field"><label for="dref-{{ kind }}-{{ a.pk }}">ارجاعِ مستند</label><input id="dref-{{ kind }}-{{ a.pk }}" class="pa-ltr" name="reference" required minlength="6"></div>
    <button class="pa-btn" type="submit">ثبتِ تسویه</button>
  </form>
</details>
{% endif %}
