{% load storefront_builder_extras %}
{# Media form field group — item text (title + the kind's text field). Shared by the legacy linear form and the R4 modal's "محتوا" tab. #}
{% if config.text_field != "title" %}
<div class="form-group">
  <label for="id_title">عنوان</label>
  <input type="text" name="title" id="id_title" class="form-input" maxlength="200" value="{{ item.title|default:'' }}">
</div>
{% endif %}
<div class="form-group">
  <label for="id_text_field">{{ config.text_label }}</label>
  <input type="text" name="{{ config.text_field }}" id="id_text_field" class="form-input" maxlength="300"
         value="{% if item %}{{ item|getattribute:config.text_field|default:'' }}{% endif %}">
</div>
