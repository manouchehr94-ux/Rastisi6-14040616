<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f4f5f8;font-family:Tahoma,'Vazirmatn',Arial,sans-serif;direction:rtl;text-align:right">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f8;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden">
        <tr><td style="background:{{ primary_color }};color:#ffffff;padding:18px 24px;font-size:18px;font-weight:bold">{{ store_name }}</td></tr>
        <tr><td style="padding:24px;color:#1f2937;font-size:15px;line-height:2">
          <h1 style="margin:0 0 12px;font-size:17px">{{ subject }}</h1>
          {% for line in paragraphs %}<p style="margin:0 0 10px">{{ line }}</p>{% endfor %}
        </td></tr>
        <tr><td style="padding:14px 24px;background:#fafafa;color:#6b7280;font-size:12px">این پیام به‌صورت خودکار از {{ store_name }} ارسال شده است.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
