<div class="field-group" style="margin-bottom:12px">
  <label class="field-label" for="{{ f.id_for_label }}" style="display:block;font-size:12.5px;margin-bottom:4px">{{ f.label }}</label>
  {{ f }}
  {% if help %}<small style="color:var(--muted,#6b7280)">{{ help }}</small>{% endif %}
  {% for err in f.errors %}<div class="coup-err" role="alert" style="color:var(--red-ink,#b91c1c);font-size:12px">{{ err }}</div>{% endfor %}
</div>
