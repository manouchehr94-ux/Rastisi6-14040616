# STEP 1 ONLY - port-80 block used to obtain the TLS certificate before
# rastisi.conf (which references the certificate files) can pass `nginx -t`.
#   sudo cp rastisi-http-bootstrap.conf /etc/nginx/sites-available/rastisi-bootstrap.conf
#   sudo ln -s /etc/nginx/sites-available/rastisi-bootstrap.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/rastisi/acme --cert-name rastisi.ir \
#        -d rastisi.ir -d www.rastisi.ir -d platformadmins.rastisi.ir \
#        -d demo-v5.rastisi.ir -d demo-arch02.rastisi.ir
# Then REMOVE this file's symlink and enable rastisi.conf instead.
# Explicit server_name only: no default_server, so other sites are unaffected.
server {
    listen 80;
    listen [::]:80;
    server_name rastisi.ir www.rastisi.ir platformadmins.rastisi.ir demo-v5.rastisi.ir demo-arch02.rastisi.ir;
    location /.well-known/acme-challenge/ { root /var/www/rastisi/acme; }
    location / { return 404; }
}
