# =============================================================================
# nginx virtual hosts for RastiSi ONLY.
#   install:  sudo cp rastisi.conf /etc/nginx/sites-available/rastisi.conf
#             sudo ln -s /etc/nginx/sites-available/rastisi.conf /etc/nginx/sites-enabled/rastisi.conf
#             sudo nginx -t && sudo systemctl reload nginx
#
# Safety rules for a VPS that also hosts rastiservice.ir:
#   * every server block names its hosts explicitly - there is NO default_server
#     and NO catch-all, so requests for any other site are never captured here;
#   * this file is a separate file; it never edits or includes another site's;
#   * upstream is RastiSi's own unix socket, so no port can collide.
#
# TLS: one certificate named "rastisi.ir" covering the five names below, e.g.
#   sudo certbot certonly --nginx --cert-name rastisi.ir \
#     -d rastisi.ir -d www.rastisi.ir -d platformadmins.rastisi.ir \
#     -d demo-v5.rastisi.ir -d demo-arch02.rastisi.ir
# =============================================================================

upstream rastisi_app {
    server unix:/run/rastisi/gunicorn.sock fail_timeout=0;
}

# ---- HTTP: redirect only ------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name rastisi.ir www.rastisi.ir platformadmins.rastisi.ir demo-v5.rastisi.ir demo-arch02.rastisi.ir;

    location /.well-known/acme-challenge/ { root /var/www/rastisi/acme; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS: the five RastiSi hosts -----------------------------------------------
server {
    # `http2` on the listen line works on every nginx version (nginx >= 1.25.1 only warns that it is deprecated).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rastisi.ir www.rastisi.ir platformadmins.rastisi.ir demo-v5.rastisi.ir demo-arch02.rastisi.ir;

    ssl_certificate     /etc/letsencrypt/live/rastisi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rastisi.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rastisi_tls:10m;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;

    # Collected static files (collectstatic -> DJANGO_STATIC_ROOT).
    location /static/ {
        alias /var/www/rastisi/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }

    # Public media only (DJANGO_MEDIA_ROOT). The private export/import directory
    # (DJANGO_PRIVATE_MEDIA_ROOT) is deliberately NOT mapped here.
    location /media/ {
        alias /var/www/rastisi/media/;
        expires 7d;
        autoindex off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        # Uploaded files are data: never let a browser run anything from them.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location ~ /\.(?!well-known) { deny all; }

    location / {
        proxy_pass http://rastisi_app;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        # OVERWRITE (never append client-supplied values): nginx is the first hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
