# RastiSi Architecture Registry (machine-readable)
# status: CANONICAL
# code_baseline: 5883a1404a8b0f1f245f0d8ef17ac5c13e40a7cb
# last_verified_against_code: 5883a1404a8b0f1f245f0d8ef17ac5c13e40a7cb
# source_phases: Phase 1 / Phase 2 / Phase 4
# NOTE: UNKNOWN = evidence genuinely missing (not "not applicable").
# Fields use exact code paths/symbols where practical.

schema_version: 1

# Field semantics — makes the two DISTINCT concepts unambiguous for future agents.
# Each domain below carries BOTH of these; do NOT use a generic domain-level `status:`
# to represent readiness (that was the pre-repair ambiguity).
field_semantics:
  phase4_prepack_documentation_readiness:
    description: >-
      Historical Phase-4 finding: documentation readiness measured BEFORE the Phase-6
      canonical Domain Knowledge Packs were authored. Preserved as-is; it does NOT
      describe the current state of the canonical documentation.
    vocabulary: [READY, PARTIAL, POOR, MISSING, CONFLICTED]
  canonical_pack_status:
    description: >-
      CURRENT status of this domain's Architecture Knowledge System pack (docs/
      architecture_knowledge_system/domains/<app>/). CANONICAL = a Phase-6 pack exists
      and is the authoritative documentation for the domain. Independent of code freshness.
    vocabulary: [CANONICAL]
  code_baseline / last_verified_against_code:
    description: >-
      The frozen production commit these facts were verified against. A pack may be
      canonical_pack_status: CANONICAL yet still require a future delta audit against
      newer production code — canonical-pack completion is NOT code freshness.

